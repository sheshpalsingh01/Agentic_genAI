[project]
name = "agentic-genai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sheshpal Singh", email = "sheshpalsingh2024@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.4.0",
    "ipython>=9.17.1",
    "langchain>=1.4.3",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.6.7",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.12",
    "langgraph-cli[inmem,inmen]>=0.4.33",
    "langsmith>=0.14.3",
    "numpy>=2.5.3",
    "python-dotenv>=1.2.4",
]

[project.scripts]
agentic-genai = "agentic_genai:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"
